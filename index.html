<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Match Score Tracker</title>
<style>
  :root{
    --bg: #000000;
    --panel: #111214;
    --divider: #2a2c30;
    --text: #FFFFFF;
    --p1: #39E0FF;
    --p2: #FF4D6D;
    --plus: #2FE875;
    --minus: #FF5A4E;
    --amber: #FFC94A;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    height:100dvh;
    width:100vw;
  }

  /* ---------- SCORE DISPLAY ---------- */
  .scoreboard{
    flex: 1 1 42%;
    display:flex;
    position:relative;
    min-height: 0;
  }

  .score-half{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(4px, 1.5vh, 12px);
    padding: 8px 4px;
    min-width:0;
  }

  .score-half.p1 .score-num{ color: var(--p1); text-shadow: 0 0 18px rgba(57,224,255,0.45); }
  .score-half.p2 .score-num{ color: var(--p2); text-shadow: 0 0 18px rgba(255,77,109,0.45); }

  .player-label{
    font-size: clamp(14px, 3.2vh, 22px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.85;
  }
  .score-half.p1 .player-label{ color: var(--p1); }
  .score-half.p2 .player-label{ color: var(--p2); }

  .score-num{
    font-family: 'Courier New', Consolas, monospace;
    font-weight: 900;
    font-size: clamp(64px, 22vh, 220px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .serve-dots{
    display:flex;
    gap: 10px;
    height: clamp(14px, 2vh, 20px);
    align-items:center;
  }
  .serve-dot{
    width: clamp(10px, 1.6vh, 16px);
    height: clamp(10px, 1.6vh, 16px);
    border-radius: 50%;
    border: 2px solid var(--amber);
    background: transparent;
  }
  .serve-dot.filled{ background: var(--amber); }

  .center-divider{
    position:absolute;
    left:50%;
    top:8%;
    bottom:8%;
    width:2px;
    background: var(--divider);
    transform: translateX(-1px);
  }

  /* ---------- CONTROL BUTTONS ---------- */
  .controls{
    flex: 1 1 46%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    background: var(--divider);
    min-height:0;
  }

  button{
    border:none;
    margin:0;
    font-family: inherit;
    cursor:pointer;
    color: var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-user-select:none;
    user-select:none;
  }

  button:active{ filter: brightness(0.8); }
  button:focus-visible{ outline: 4px solid var(--amber); outline-offset: -4px; }

  .score-btn{
    background: var(--panel);
    font-size: clamp(48px, 12vh, 110px);
    font-weight: 800;
    line-height:1;
  }
  .score-btn.plus{ color: var(--plus); }
  .score-btn.minus{ color: var(--minus); }

  /* ---------- BOTTOM BAR ---------- */
  .bottom-bar{
    flex: 1 1 12%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    background: var(--divider);
    min-height: 68px;
  }

  .serve-btn{
    background: #1b1c1f;
    color: var(--amber);
    font-size: clamp(15px, 3.4vh, 26px);
    font-weight: 700;
    text-align:center;
    padding: 4px 6px;
    letter-spacing: 0.02em;
  }

  .reset-btn{
    background: #3a1414;
    color: #FF8A80;
    font-size: clamp(16px, 3.6vh, 28px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  @media (max-width: 480px){
    .player-label{ font-size: clamp(12px, 2.6vh, 18px); }
  }

  @media (orientation: landscape) and (max-height: 500px){
    .scoreboard{ flex-basis: 40%; }
    .controls{ flex-basis: 44%; }
    .bottom-bar{ flex-basis: 16%; }
  }

  .sr-only{
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

  <div class="scoreboard">
    <div class="center-divider"></div>
    <div class="score-half p1">
      <div class="player-label">Player 1</div>
      <div class="score-num" id="score1">0</div>
      <div class="serve-dots" id="dots1">
        <div class="serve-dot" id="dot1a"></div>
        <div class="serve-dot" id="dot1b"></div>
      </div>
    </div>
    <div class="score-half p2">
      <div class="player-label">Player 2</div>
      <div class="score-num" id="score2">0</div>
      <div class="serve-dots" id="dots2">
        <div class="serve-dot" id="dot2a"></div>
        <div class="serve-dot" id="dot2b"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="score-btn plus" id="p1plus" aria-label="Increase Player 1 score">+</button>
    <button class="score-btn plus" id="p2plus" aria-label="Increase Player 2 score">+</button>
    <button class="score-btn minus" id="p1minus" aria-label="Decrease Player 1 score">&minus;</button>
    <button class="score-btn minus" id="p2minus" aria-label="Decrease Player 2 score">&minus;</button>
  </div>

  <div class="bottom-bar">
    <button class="serve-btn" id="serveBtn">Player 1 &middot; 1st Serve</button>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>

  <div id="announcer" class="sr-only" aria-live="polite" role="status"></div>

<script>
  let score1 = 0;
  let score2 = 0;
  // serve state: 0 = P1 1st, 1 = P1 2nd, 2 = P2 1st, 3 = P2 2nd
  let serveState = 0;

  const score1El = document.getElementById('score1');
  const score2El = document.getElementById('score2');
  const serveBtn = document.getElementById('serveBtn');
  const announcer = document.getElementById('announcer');

  function announce(message){
    // Clear first so repeated identical messages are still announced
    announcer.textContent = '';
    setTimeout(() => { announcer.textContent = message; }, 50);
  }

  function announceScores(){
    announce(score1 + '. ' + score2 + '.');
  }

  const dots = {
    1: [document.getElementById('dot1a'), document.getElementById('dot1b')],
    2: [document.getElementById('dot2a'), document.getElementById('dot2b')]
  };

  const serveLabels = [
    'Player 1 \u00b7 1st Serve',
    'Player 1 \u00b7 2nd Serve',
    'Player 2 \u00b7 1st Serve',
    'Player 2 \u00b7 2nd Serve'
  ];

  function renderScores(){
    score1El.textContent = score1;
    score2El.textContent = score2;
  }

  function renderServe(){
    serveBtn.textContent = serveLabels[serveState];

    // which player is serving, and how many dots filled (1st serve = 1 dot, 2nd serve = 2 dots)
    const servingPlayer = serveState < 2 ? 1 : 2;
    const filledCount = (serveState % 2 === 0) ? 1 : 2;

    [1,2].forEach(player => {
      dots[player].forEach((dot, i) => {
        const isServer = player === servingPlayer;
        dot.classList.toggle('filled', isServer && i < filledCount);
        dot.style.visibility = isServer ? 'visible' : 'hidden';
      });
    });
  }

  document.getElementById('p1plus').addEventListener('click', () => { score1++; renderScores(); announceScores(); });
  document.getElementById('p1minus').addEventListener('click', () => { score1 = Math.max(0, score1 - 1); renderScores(); announceScores(); });
  document.getElementById('p2plus').addEventListener('click', () => { score2++; renderScores(); announceScores(); });
  document.getElementById('p2minus').addEventListener('click', () => { score2 = Math.max(0, score2 - 1); renderScores(); announceScores(); });

  serveBtn.addEventListener('click', () => {
    serveState = (serveState + 1) % 4;
    renderServe();
    announce(serveLabels[serveState]);
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    score1 = 0;
    score2 = 0;
    serveState = 0;
    renderScores();
    renderServe();
    announce('Reset. ' + serveLabels[serveState] + '. Player 1: 0. Player 2: 0.');
  });

  renderScores();
  renderServe();
</script>

</body>
</html>
