<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Match Score Tracker</title>
<style>
  :root{
    --bg: #000000;
    --panel: #111214;
    --divider: #2a2c30;
    --text: #FFFFFF;
    --p1: #39E0FF;
    --p2: #FF4D6D;
    --goal: #2FE875;
    --foul: #FFA733;
    --amber: #FFC94A;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    height:100dvh;
    width:100vw;
  }

  /* ---------- SCORE DISPLAY ---------- */
  .scoreboard{
    flex: 1 1 0;
    display:flex;
    position:relative;
    min-height: 0;
  }

  .score-half{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(4px, 1.5vh, 12px);
    padding: 8px 4px;
    min-width:0;
  }

  .score-half.p1 .score-num{ color: var(--p1); text-shadow: 0 0 18px rgba(57,224,255,0.45); }
  .score-half.p2 .score-num{ color: var(--p2); text-shadow: 0 0 18px rgba(255,77,109,0.45); }

  .player-label{
    font-size: clamp(14px, 3.2vh, 22px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.85;
  }
  .score-half.p1 .player-label{ color: var(--p1); }
  .score-half.p2 .player-label{ color: var(--p2); }

  .score-num{
    font-family: 'Courier New', Consolas, monospace;
    font-weight: 900;
    font-size: clamp(56px, 18vh, 200px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .serve-dots{
    display:flex;
    gap: 10px;
    height: clamp(14px, 2vh, 20px);
    align-items:center;
  }
  .serve-dot{
    width: clamp(10px, 1.6vh, 16px);
    height: clamp(10px, 1.6vh, 16px);
    border-radius: 50%;
    border: 2px solid var(--amber);
    background: transparent;
  }
  .serve-dot.filled{ background: var(--amber); }

  .center-divider{
    position:absolute;
    left:50%;
    top:8%;
    bottom:8%;
    width:2px;
    background: var(--divider);
    transform: translateX(-1px);
  }

  /* ---------- SERVE STATE BOX ---------- */
  .serve-state-bar{
    flex: 0 0 auto;
    min-height: 56px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #1b1c1f;
    color: var(--amber);
    font-weight: 700;
    font-size: clamp(16px, 3.6vh, 28px);
    letter-spacing: 0.04em;
    text-align:center;
    padding: 6px 10px;
    border-top: 2px solid var(--divider);
    border-bottom: 2px solid var(--divider);
  }

  .serve-state-bar.win{
    background: #1a2e1a;
    color: var(--goal);
  }

  /* ---------- CONTROL BUTTONS ---------- */
  .controls{
    flex: 1 1 0;
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    background: var(--divider);
    min-height:0;
  }

  button{
    border:none;
    margin:0;
    font-family: inherit;
    cursor:pointer;
    color: var(--text);
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    gap: 4px;
    -webkit-user-select:none;
    user-select:none;
  }

  button:active{ filter: brightness(0.8); }
  button:focus-visible{ outline: 4px solid var(--amber); outline-offset: -4px; }

  .action-btn{
    background: var(--panel);
    line-height:1.1;
  }

  .action-btn[disabled]{
    opacity: 0.35;
    cursor: default;
  }
  .action-btn[disabled]:active{ filter:none; }

  .btn-player{
    font-size: clamp(16px, 3.6vh, 30px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .action-btn.p1 .btn-player{ color: var(--p1); }
  .action-btn.p2 .btn-player{ color: var(--p2); }

  .btn-action{
    font-size: clamp(28px, 8vh, 64px);
    font-weight: 900;
  }
  .action-btn.goal .btn-action{ color: var(--goal); }
  .action-btn.foul .btn-action{ color: var(--foul); }

  /* ---------- BOTTOM BAR ---------- */
  .bottom-bar{
    flex: 0 0 auto;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    background: var(--divider);
    min-height: 68px;
  }

  .undo-btn{
    background: #1b1c1f;
    color: var(--amber);
    font-size: clamp(16px, 3.6vh, 28px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .undo-btn[disabled]{
    color: #6b6552;
    cursor: default;
  }
  .undo-btn[disabled]:active{ filter:none; }

  .reset-btn{
    background: #3a1414;
    color: #FF8A80;
    font-size: clamp(16px, 3.6vh, 28px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  @media (max-width: 480px){
    .player-label{ font-size: clamp(12px, 2.6vh, 18px); }
  }

  @media (orientation: landscape) and (max-height: 500px){
    .serve-state-bar{ min-height: 40px; }
    .bottom-bar{ min-height: 52px; }
  }

  .sr-only{
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

  <div class="scoreboard">
    <div class="center-divider"></div>
    <div class="score-half p1">
      <div class="player-label">Player 1</div>
      <div class="score-num" id="score1">0</div>
      <div class="serve-dots" id="dots1">
        <div class="serve-dot" id="dot1a"></div>
        <div class="serve-dot" id="dot1b"></div>
      </div>
    </div>
    <div class="score-half p2">
      <div class="player-label">Player 2</div>
      <div class="score-num" id="score2">0</div>
      <div class="serve-dots" id="dots2">
        <div class="serve-dot" id="dot2a"></div>
        <div class="serve-dot" id="dot2b"></div>
      </div>
    </div>
  </div>

  <div class="serve-state-bar" id="serveState" role="status" aria-live="polite">Player 1 &middot; 1st Serve</div>

  <div class="controls">
    <button class="action-btn goal p1" id="p1goal" aria-label="Player 1 Goal">
      <span class="btn-player">Player 1</span>
      <span class="btn-action">GOAL</span>
    </button>
    <button class="action-btn goal p2" id="p2goal" aria-label="Player 2 Goal">
      <span class="btn-player">Player 2</span>
      <span class="btn-action">GOAL</span>
    </button>
    <button class="action-btn foul p1" id="p1foul" aria-label="Player 1 Foul">
      <span class="btn-player">Player 1</span>
      <span class="btn-action">FOUL</span>
    </button>
    <button class="action-btn foul p2" id="p2foul" aria-label="Player 2 Foul">
      <span class="btn-player">Player 2</span>
      <span class="btn-action">FOUL</span>
    </button>
  </div>

  <div class="bottom-bar">
    <button class="undo-btn" id="undoBtn" disabled>Undo</button>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>

  <div id="announcer" class="sr-only" aria-live="polite" role="status"></div>

  <audio id="winSound" src="win.mp3" preload="auto"></audio>

<script>
  let score1 = 0;
  let score2 = 0;
  // serve state: 0 = P1 1st, 1 = P1 2nd, 2 = P2 1st, 3 = P2 2nd
  let serveState = 0;
  let history = []; // { player, amount, prevServe }
  let winner = null; // null, 1, or 2

  const score1El = document.getElementById('score1');
  const score2El = document.getElementById('score2');
  const serveStateEl = document.getElementById('serveState');
  const undoBtn = document.getElementById('undoBtn');
  const announcer = document.getElementById('announcer');
  const winSound = document.getElementById('winSound');
  const actionButtons = [
    document.getElementById('p1goal'),
    document.getElementById('p2goal'),
    document.getElementById('p1foul'),
    document.getElementById('p2foul')
  ];

  const dots = {
    1: [document.getElementById('dot1a'), document.getElementById('dot1b')],
    2: [document.getElementById('dot2a'), document.getElementById('dot2b')]
  };

  const serveLabels = [
    'Player 1 \u00b7 1st Serve',
    'Player 1 \u00b7 2nd Serve',
    'Player 2 \u00b7 1st Serve',
    'Player 2 \u00b7 2nd Serve'
  ];

  function announce(message){
    // Clear first so repeated identical messages are still announced
    announcer.textContent = '';
    setTimeout(() => { announcer.textContent = message; }, 50);
  }

  function announceScores(){
    announce(score1 + '. ' + score2 + '.');
  }

  function renderScores(){
    score1El.textContent = score1;
    score2El.textContent = score2;
  }

  function renderServe(){
    serveStateEl.textContent = serveLabels[serveState];

    const servingPlayer = serveState < 2 ? 1 : 2;
    const filledCount = (serveState % 2 === 0) ? 1 : 2;

    [1,2].forEach(player => {
      dots[player].forEach((dot, i) => {
        const isServer = player === servingPlayer;
        dot.classList.toggle('filled', isServer && i < filledCount);
        dot.style.visibility = isServer ? 'visible' : 'hidden';
      });
    });
  }

  function updateUndoState(){
    undoBtn.disabled = history.length === 0;
  }

  function checkWin(){
    if(score1 >= 11 && score1 - score2 >= 2) return 1;
    if(score2 >= 11 && score2 - score1 >= 2) return 2;
    return null;
  }

  function setActionButtonsDisabled(disabled){
    actionButtons.forEach(btn => { btn.disabled = disabled; });
  }

  function showWinner(player){
    winner = player;
    serveStateEl.textContent = 'Player ' + player + ' Wins!';
    serveStateEl.classList.add('win');
    setActionButtonsDisabled(true);
    winSound.currentTime = 0;
    winSound.play().catch(() => {});
  }

  function clearWinner(){
    winner = null;
    serveStateEl.classList.remove('win');
    setActionButtonsDisabled(false);
    renderServe();
  }

  function applyWinCheck(){
    const won = checkWin();
    if(won){
      showWinner(won);
    } else if(winner !== null){
      clearWinner();
    }
  }

  function addPoints(player, amount){
    if(winner !== null) return;

    const prevServe = serveState;
    if(player === 1){ score1 += amount; } else { score2 += amount; }
    history.push({ player, amount, prevServe });
    serveState = (serveState + 1) % 4;

    renderScores();
    renderServe();
    announceScores();
    updateUndoState();
    applyWinCheck();
  }

  document.getElementById('p1goal').addEventListener('click', () => addPoints(1, 2));
  document.getElementById('p2goal').addEventListener('click', () => addPoints(2, 2));
  document.getElementById('p1foul').addEventListener('click', () => addPoints(2, 1));
  document.getElementById('p2foul').addEventListener('click', () => addPoints(1, 1));

  undoBtn.addEventListener('click', () => {
    if(history.length === 0) return;
    const last = history.pop();
    if(last.player === 1){ score1 -= last.amount; } else { score2 -= last.amount; }
    serveState = last.prevServe;

    renderScores();
    renderServe();
    announceScores();
    updateUndoState();
    applyWinCheck();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    score1 = 0;
    score2 = 0;
    serveState = 0;
    history = [];
    winner = null;
    serveStateEl.classList.remove('win');
    setActionButtonsDisabled(false);
    renderScores();
    renderServe();
    updateUndoState();
    announce('Reset. ' + serveLabels[serveState] + '. 0. 0.');
  });

  renderScores();
  renderServe();
  updateUndoState();
</script>

</body>
</html>
